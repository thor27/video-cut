name: video-cut
base: core24
adopt-info: video-cut
summary: Simple, fast, and modern video cutting tool
description: |
  Video Cut is a lightweight, responsive video editor inspired by macOS QuickTime
  and Preview. It offers proportional filmstrip timelines, interactive crop and
  rotation, dynamic FFmpeg capability detection, multi-format export, and zero hover obstructions.

icon: src/video_cut/resources/icon_512.png
grade: stable
confinement: strict
license: GPL-3.0-or-later

apps:
  video-cut:
    command: bin/video-cut
    extensions: [gnome]
    common-id: io.github.thomaz.videocut
    desktop: usr/share/applications/io.github.thomaz.videocut.desktop
    environment:
      LD_LIBRARY_PATH: $SNAP/gnome-platform/usr/lib/x86_64-linux-gnu:$SNAP/gnome-platform/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/blas:$SNAP/usr/lib/x86_64-linux-gnu/lapack:$LD_LIBRARY_PATH
      GST_PLUGIN_SYSTEM_PATH_1_0: $SNAP/gnome-platform/usr/lib/x86_64-linux-gnu/gstreamer-1.0:$SNAP/usr/lib/x86_64-linux-gnu/gstreamer-1.0
    plugs:
      - home
      - removable-media
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - audio-playback
      - gsettings
      - opengl

parts:
  video-cut:
    plugin: python
    source: .
    stage-packages:
      - ffmpeg
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-libav
    stage:
      - -usr/lib/*/libharfbuzz*
      - -usr/lib/*/librsvg*
      - -usr/lib/*/libpango*
      - -usr/lib/*/libcairo*
      - -usr/lib/*/libgdk_pixbuf*
      - -usr/lib/*/libfontconfig*
      - -usr/lib/*/libfribidi*
      - -usr/lib/*/libpixman*
      - -usr/lib/*/libdatrie*
      - -usr/lib/*/libthai*
    override-pull: |
      craftctl default
      VERSION="$(grep -m1 '^__version__' src/video_cut/__init__.py | cut -d'"' -f2)"
      craftctl set version="$VERSION"
    override-build: |
      craftctl default
      # Ensure style.css and package assets are in installed site-packages
      for pydir in ${CRAFT_PART_INSTALL}/lib/python*/site-packages/video_cut; do
        if [ -d "$pydir" ]; then
          cp -f src/video_cut/style.css "$pydir/style.css"
          cp -rf src/video_cut/resources "$pydir/"
          cp -rf src/video_cut/locale "$pydir/"
        fi
      done
      # Also install style.css, desktop file, and icons into standard system paths
      install -D -m 644 src/video_cut/style.css \
        ${CRAFT_PART_INSTALL}/usr/share/video-cut/style.css
      install -D -m 644 src/video_cut/resources/io.github.thomaz.videocut.desktop \
        ${CRAFT_PART_INSTALL}/usr/share/applications/io.github.thomaz.videocut.desktop
      install -D -m 644 src/video_cut/resources/io.github.thomaz.videocut.svg \
        ${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/scalable/apps/io.github.thomaz.videocut.svg
      install -D -m 644 src/video_cut/resources/hicolor/scalable/actions/video-split-symbolic.svg \
        ${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/scalable/actions/video-split-symbolic.svg
      install -D -m 644 src/video_cut/resources/icon_512.png \
        ${CRAFT_PART_INSTALL}/usr/share/pixmaps/video-cut.png
      install -D -m 644 src/video_cut/resources/icon_512.png \
        ${CRAFT_PART_INSTALL}/usr/share/pixmaps/io.github.thomaz.videocut.png
      for size in 16 24 32 48 64 128 256 512; do
        if [ -f "src/video_cut/resources/icon_${size}.png" ]; then
          install -D -m 644 src/video_cut/resources/icon_${size}.png \
            ${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/${size}x${size}/apps/io.github.thomaz.videocut.png
        fi
      done
    override-prime: |
      craftctl default
      for arch in x86_64-linux-gnu aarch64-linux-gnu; do
        if [ -d "${CRAFT_PRIME}/usr/lib/${arch}/blas" ]; then
          ln -sf blas/libblas.so.3 "${CRAFT_PRIME}/usr/lib/${arch}/libblas.so.3"
        fi
        if [ -d "${CRAFT_PRIME}/usr/lib/${arch}/lapack" ]; then
          ln -sf lapack/liblapack.so.3 "${CRAFT_PRIME}/usr/lib/${arch}/liblapack.so.3"
        fi
      done
