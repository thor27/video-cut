[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-cut"
dynamic = ["version"]
description = "Easy-to-use video editor to cut and merge videos, add images, crop, and rotate"
authors = [
    { name = "Thomaz Reis", email = "thor27@gmail.com" }
]
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.42.0",
]

[project.scripts]
video-cut = "video_cut.__main__:main"

[tool.setuptools.package-data]
video_cut = ["style.css", "resources/*", "resources/*/*/*/*", "locale/*/*/*"]

[tool.setuptools.dynamic]
version = {attr = "video_cut.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter/readable wrapping)
    "E402",  # module level import not at top of file (needed for gi.require_version)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["video_cut"]


