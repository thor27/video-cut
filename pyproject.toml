[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-cut"
dynamic = ["version"]
description = "Easy-to-use tool to edit video, add images, merge multiple videos together, crop, and rotate"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.42.0",
]

[project.scripts]
video-cut = "video_cut.__main__:main"

[tool.setuptools.package-data]
video_cut = ["style.css", "resources/*", "resources/*/*/*/*", "locale/*/*/*"]

[tool.setuptools.dynamic]
version = {attr = "video_cut.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

