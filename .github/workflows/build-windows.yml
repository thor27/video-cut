name: Build Windows

on:
  push:
    branches:
      - main
      - feat/windows-packaging
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - feat/macos-packaging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Executable (.exe & .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 UCRT64 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-pyinstaller
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-inno-setup

      - name: Build Windows Standalone Package & Installer
        shell: msys2 {0}
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_windows.sh

      - name: Smoke Test Standalone Executable
        shell: msys2 {0}
        run: |
          ./dist/VideoCut/VideoCut.exe --version

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoCut-Windows-x86_64
          path: |
            dist/*.zip
            dist/*Setup.exe
          if-no-files-found: error
