name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv python3-gi python3-cairo python3-pil \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 \
            libgtk-4-1 libgtk-4-media-gstreamer libadwaita-1-0 libgraphene-1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-alsa gstreamer1.0-pipewire \
            ffmpeg xvfb appstream desktop-file-utils squashfs-tools fonts-noto-color-emoji

      - name: Install Package
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Validate Desktop Metadata & Packaging Configs
        run: |
          desktop-file-validate src/video_cut/resources/io.github.thor27.video-cut.desktop
          appstreamcli validate --no-net io.github.thor27.video-cut.metainfo.xml
          ./scripts/build_flatpak.sh --validate-only
          ./scripts/build_appimage.sh

      - name: Run Tests
        run: xvfb-run -a .venv/bin/python -m pytest -q
