name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev zip zstd squashfs-tools flatpak flatpak-builder \
            python3-venv python3-gi python3-cairo python3-pil \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 \
            libgtk-4-1 libadwaita-1-0 libgraphene-1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            ffmpeg desktop-file-utils appstream

      - name: Cache Flatpak Runtimes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/flatpak
          key: flatpak-gnome51

      - name: Cache Build Tools (Static FFmpeg)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: build-tools-ffmpeg-v7

      - name: Set up Flatpak Environment
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Build All Distribution Packages & Source Archives
        run: |
          chmod +x scripts/*.sh packaging/appimage/AppRun
          RELEASE_VER="${GITHUB_REF_NAME#v}"
          export VERSION="${RELEASE_VER}"
          ./scripts/set_version.sh "${RELEASE_VER}" || true
          ./scripts/build_packages.sh --all

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(*.deb *.AppImage *.flatpak *.tar.gz *.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found in dist/" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "Video Cut ${{ github.ref_name }}"
          generate_release_notes: true
          draft: true
          prerelease: false
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.flatpak
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    name: Build & Publish macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install System Dependencies via Homebrew
        run: |
          brew update
          brew install gtk4 libadwaita adwaita-icon-theme pygobject3 gstreamer ffmpeg

      - name: Install Python Build Dependencies
        run: |
          BREW_PYTHON="$(brew --prefix)/bin/python3"
          "${BREW_PYTHON}" -m venv --system-site-packages .venv-macos
          source .venv-macos/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install --no-build-isolation --no-deps -e .
          pip install pyinstaller pillow

      - name: Build macOS Application (.app & .dmg)
        run: |
          source .venv-macos/bin/activate
          chmod +x scripts/build_macos.sh
          RELEASE_VER="${GITHUB_REF_NAME#v}"
          export VERSION="${RELEASE_VER}"
          ./scripts/build_macos.sh --dmg

      - name: Upload macOS Assets to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    name: Build & Attach Windows Executable (.exe & .zip)
    needs: [build-packages]
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup MSYS2 UCRT64 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-pyinstaller
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-inno-setup

      - name: Build Windows Standalone Package & Installer
        shell: msys2 {0}
        run: |
          chmod +x scripts/*.sh
          RELEASE_VER="${GITHUB_REF_NAME#v}"
          export VERSION="${RELEASE_VER}"
          ./scripts/build_windows.sh

      - name: Upload Windows Assets to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


