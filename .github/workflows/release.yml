name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zip zstd squashfs-tools

      - name: Build All Distribution Packages & Source Archives
        run: |
          chmod +x scripts/*.sh packaging/appimage/AppRun
          RELEASE_VER="${GITHUB_REF_NAME#v}"
          export VERSION="${RELEASE_VER}"
          ./scripts/set_version.sh "${RELEASE_VER}" || true
          ./scripts/build_packages.sh --all

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(*.deb *.AppImage *.flatpak *.tar.gz *.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found in dist/" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "Video Cut ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.flatpak
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
