<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <description>Relocatable macOS Fontconfig configuration for Video Cut</description>

    <!-- Standard macOS system and user font directories -->
    <dir>/System/Library/Fonts</dir>
    <dir>/Library/Fonts</dir>
    <dir>~/Library/Fonts</dir>
    <dir>/System/Library/AssetsV2/com_apple_MobileAsset_Font8</dir>
    <dir prefix="xdg">fonts</dir>

    <!-- Writable per-user cache directory (safe when running from read-only .dmg) -->
    <cachedir>~/Library/Caches/io.github.thor27.video-cut/fontconfig</cachedir>

    <!-- Reject non-scalable legacy bitmap fonts while keeping scalable color emoji fonts -->
    <selectfont>
        <rejectfont>
            <pattern>
                <patelt name="outline"><bool>false</bool></patelt>
                <patelt name="scalable"><bool>false</bool></patelt>
            </pattern>
        </rejectfont>
    </selectfont>

    <!-- Scale bitmap/color-emoji fonts smoothly to the requested pixelsize (from 10-scale-bitmap-fonts.conf) -->
    <match target="font">
        <test name="outline" compare="eq">
            <bool>false</bool>
        </test>
        <edit name="pixelsizefixupfactor" mode="assign">
            <divide>
                <name target="pattern">pixelsize</name>
                <name target="font">pixelsize</name>
            </divide>
        </edit>
    </match>
    <match target="font">
        <test name="outline" compare="eq">
            <bool>false</bool>
        </test>
        <test name="pixelsizefixupfactor" compare="not_eq">
            <double>1.0</double>
        </test>
        <edit name="matrix" mode="assign">
            <times>
                <name>matrix</name>
                <matrix>
                    <name>pixelsizefixupfactor</name> <double>0</double>
                    <double>0</double> <name>pixelsizefixupfactor</name>
                </matrix>
            </times>
        </edit>
        <edit name="size" mode="assign">
            <divide>
                <name>size</name>
                <name>pixelsizefixupfactor</name>
            </divide>
        </edit>
    </match>

    <!-- Emoji generic family and und-zsye language matching (from 45-generic.conf / 60-generic.conf) -->
    <alias binding="same">
        <family>Apple Color Emoji</family>
        <default><family>emoji</family></default>
    </alias>
    <match>
        <test name="family">
            <string>emoji</string>
        </test>
        <edit name="lang" mode="prepend">
            <string>und-zsye</string>
        </edit>
    </match>
    <match>
        <test name="lang">
            <string>und-zsye</string>
        </test>
        <test qual="all" name="family" compare="not_eq">
            <string>emoji</string>
        </test>
        <edit name="family" mode="append" binding="strong">
            <string>emoji</string>
        </edit>
    </match>
    <match>
        <test name="lang">
            <string>und-zsye</string>
        </test>
        <test qual="all" name="color" compare="not_eq">
            <bool>true</bool>
        </test>
        <test qual="all" name="color" compare="not_eq">
            <bool>false</bool>
        </test>
        <edit name="color" mode="append">
            <bool>true</bool>
        </edit>
    </match>
    <alias binding="same">
        <family>emoji</family>
        <prefer>
            <family>Apple Color Emoji</family>
        </prefer>
    </alias>

    <!-- Ensure System Font falls back to Apple Color Emoji for emoji glyphs -->
    <alias>
        <family>System Font</family>
        <default>
            <family>Apple Color Emoji</family>
        </default>
    </alias>

    <!-- Map generic sans-serif to macOS System Font (SF Pro) with Helvetica Neue & Emoji fallback -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>System Font</family>
            <family>Helvetica Neue</family>
            <family>Helvetica</family>
            <family>Arial</family>
            <family>Apple Color Emoji</family>
        </prefer>
    </alias>

    <alias>
        <family>Sans</family>
        <prefer>
            <family>System Font</family>
            <family>Helvetica Neue</family>
            <family>Helvetica</family>
            <family>Arial</family>
            <family>Apple Color Emoji</family>
        </prefer>
    </alias>

    <!-- Map generic monospace to macOS native Menlo / SF Mono -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>.SF NS Mono</family>
            <family>Menlo</family>
            <family>Monaco</family>
            <family>Courier New</family>
            <family>Apple Color Emoji</family>
        </prefer>
    </alias>

    <!-- Smooth antialiased slight-hinted rendering for crisp text on 1x and Retina displays -->
    <match target="font">
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        <edit name="hinting" mode="assign"><bool>true</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
        <edit name="rgba" mode="assign"><const>none</const></edit>
    </match>
</fontconfig>
